name: Archive raw data

# Cold archive, not a serving path.
#
# The upstream mirror is one person's research project on a university box. If
# it goes away, the 221MB of extracted Parquet is irreplaceable and every
# derived artifact with it. Release assets allow 2GB per file and live outside
# git history, so this costs the repo nothing.

on:
  schedule:
    # 04:00 UTC on the 1st. Quarterly would also be defensible; monthly is
    # cheap and the data only grows.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      full_extract:
        description: "Ignore the cache and re-extract everything from upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Shares the nightly job's cache, so an archive normally costs upstream
      # almost nothing. On a miss -- or a deliberate full_extract -- it falls
      # back to a complete 88-request extraction, which is the honest thing to
      # do for something whose whole purpose is to be a faithful copy.
      - name: Restore extracted data
        if: ${{ !inputs.full_extract }}
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-
          restore-keys: raw-

      - name: Extract anything missing
        working-directory: pipeline
        run: uv run python -m znhstry all

      - name: Verify before archiving
        working-directory: pipeline
        run: |
          uv run python - <<'PY'
          import polars as pl
          from znhstry import config

          events = pl.scan_parquet(config.RAW / "changelog" / "*.parquet")
          zones = pl.scan_parquet(config.RAW / "zones" / "*.parquet")
          counts = {
              "events": events.select(pl.len()).collect().item(),
              "zones": zones.select(pl.len()).collect().item(),
          }
          print(counts)
          # An archive of a truncated extraction is worse than no archive,
          # because it looks like a backup. These floors are well below the
          # real figures (9.87M / 2.68M) and only catch gross failure.
          assert counts["events"] > 9_000_000, "changelog looks truncated"
          assert counts["zones"] > 2_500_000, "zones looks truncated"
          PY

      - name: Package
        id: package
        run: |
          stamp=$(date -u +%Y%m%d)
          tar -C data -cf - raw | zstd -19 -T0 -o "znhstry-raw-${stamp}.tar.zst"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          ls -lh "znhstry-raw-${stamp}.tar.zst"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stamp="${{ steps.package.outputs.stamp }}"
          gh release create "raw-${stamp}" \
            --title "Raw data snapshot ${stamp}" \
            --notes "Extracted Parquet from the QONQR mirror: \`changelog\`, \`zones\`, and lookups.

          Restore with:

          \`\`\`bash
          gh release download raw-${stamp} --pattern '*.tar.zst'
          zstd -d -c znhstry-raw-${stamp}.tar.zst | tar -C data -x
          \`\`\`

          Rebuild everything downstream with \`cd transform && uv run dbt build\`." \
            "znhstry-raw-${stamp}.tar.zst"
