name: Atlantis leaderboard

# One page from the game's monthly tournament, written under `raw/atlantis/` in the
# bucket, then published to `global/atlantis/` and the live marts so the site, the query
# console and the MCP server update every five minutes while a tournament runs. The rest
# of the site is the nightly's.
#
# ## Why there is no schedule here
#
# The tournament opens at 00:00 UTC on the 1st and runs somewhere between one and seven
# days. A cron pinned to a day range would either miss the tail of a long tournament or
# spend most of a short one fetching a page that says it is over, and a cron that fires
# all month fills the Actions list with idle runs. So the Cloudflare Worker in `trigger/`
# ticks every five minutes, reads `state.json` itself, and dispatches this workflow only
# when a collection is due. GitHub's own scheduler cannot hold a five-minute cadence, and
# in November 2026 its half-hourly fallback fired 22 of 288 ticks, so there is none.
#
# The Python step writes `next_run_at` into `state.json` after every collection: the next
# five-minute boundary while the tournament is live, the 1st of the next month once it
# has ended. The first run at or after the end time is the one that collects the final
# standings, and nothing is dispatched for the rest of the month after that.
#
# ## Why the gate is still here, and reads the public bucket with curl
#
# The Worker applies the same rule before it dispatches, so this step normally says yes.
# It stays for the doubled dispatch: a run that queued behind a slow one starts after
# `next_run_at` has moved on, reads `run=false` and stops before checkout. `state.json`
# is archived to the bucket's public URL with `Cache-Control: no-store`, so the gate needs
# no credentials, no checkout and no Python environment. `--prefix atlantis/` on restore
# and archive means a live run moves only this folder, never the 278 MB raw layer.
#
# ## Why the concurrency group is its own
#
# This job is the only writer of `raw/atlantis/`. A full `archive` with no `--prefix`
# fences that subtree off in `upload.py`: it neither uploads nor sweeps it, so the nightly
# cannot interleave with this job on those keys no matter when the two run. The group
# only has to serialize this workflow with itself, so that a run still going when the
# next tick dispatches does not restore and archive the same folder at once.
#
# ## What tells anyone it has stopped
#
# Not this workflow: with no schedule, a Worker that stops dispatching leaves no red run
# here. `atlantis-watchdog.yml` runs hourly on tournament days and fails when
# `next_run_at` is more than twenty minutes in the past. The Worker also throws when a
# dispatch or the state read fails, which marks the invocation failed in its cron log.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if state.json says no collection is due"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: atlantis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      # Before checkout, on purpose: plain bash against the public bucket, so an idle
      # run is over in seconds.
      #
      # Only a 404 means "nothing has ever been collected, so run". Any other failure is
      # a broken origin, not an empty one, and the step fails red: treating it as a first
      # run would scrape the game's server every five minutes for the rest of the month. A 200
      # with no readable `next_run_at` still runs, because a bad state file must not idle
      # the job until the 1st.
      #
      # The dispatch input reaches the shell through the environment, never through
      # `${{ }}`: an expression is pasted into the script before bash sees it.
      - name: Is a tournament on?
        id: gate
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$DATA_ORIGIN" ]; then
            echo "::error::DATA_ORIGIN is not set"
            exit 1
          fi
          code="$(curl -s -o "$RUNNER_TEMP/state.json" -w '%{http_code}' "$DATA_ORIGIN/raw/atlantis/state.json")"
          next=""
          case "$code" in
            404) ;;
            200) next="$(jq -r '.next_run_at // empty' "$RUNNER_TEMP/state.json" 2>/dev/null || true)" ;;
            *)
              echo "::error::$DATA_ORIGIN/raw/atlantis/state.json returned $code"
              exit 1
              ;;
          esac
          now="$(date -u +%s)"
          due=""
          if [ -n "$next" ]; then
            due="$(date -u -d "$next" +%s 2>/dev/null || true)"
          fi
          if [ "$FORCE" = "true" ] || [ -z "$due" ] || [ "$now" -ge "$due" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "nothing due; next run due $next" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true

      # Only this folder. On the first run ever it finds nothing and returns normally.
      - name: Restore Atlantis data
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry restore --prefix atlantis/

      - name: Collect the leaderboard
        if: steps.gate.outputs.run == 'true'
        id: atlantis
        working-directory: pipeline
        run: uv run python -m znhstry atlantis

      # Skipped only when the collection step fails, which a failed HTTP request does. A
      # layout the parser cannot read is caught in Python: it writes a `state.json` with a
      # retry time and exits 0, so that case archives and the next run tries again.
      - name: Archive Atlantis data
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry archive --prefix atlantis/

      # Publish what was just collected instead of waiting for the nightly. Only the
      # Atlantis models and the battle-report sources they read are built, and the uploads
      # are fenced to `global/atlantis/` and the live marts, so the rest of the site
      # is never touched.
      - name: Restore battle reports
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry restore --prefix battlestats/

      - name: Build the Atlantis models
        if: steps.gate.outputs.run == 'true'
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --select "+fqn:*atlantis*" --indirect-selection cautious

      - name: Export Atlantis
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry export --only atlantis

      - name: Upload Atlantis
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry upload --only atlantis

      # This warehouse holds only the Atlantis build, so a plain `marts` would fail on
      # `fct_zone_events` and a plain `upload --marts` would sweep every other mart.
      - name: Publish the live Atlantis marts
        if: steps.gate.outputs.run == 'true'
        working-directory: pipeline
        run: |
          uv run python -m znhstry marts --only atlantis
          uv run python -m znhstry upload --marts --only atlantis

      - name: Report
        if: steps.gate.outputs.run == 'true'
        env:
          ROWS: ${{ steps.atlantis.outputs.rows }}
        run: echo "collected ${ROWS:-0} leaderboard rows" >> "$GITHUB_STEP_SUMMARY"
