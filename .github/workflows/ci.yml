name: CI

# Runs on pull requests so branch protection has something to require. The
# deploy workflow builds the same way on main; this catches it before merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web

      # No reachability check here, unlike deploy.yml: a pull request should not
      # fail because an external bucket is having a moment.
      - name: Build static export
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Imports every module, so a syntax error or a bad import fails here
      # rather than at 02:30 UTC in the nightly.
      - name: Import check
        working-directory: pipeline
        run: uv run python -c "from znhstry import boundaries, config, export, ingest, marts, schema, upload"

      # Pinned: an unpinned ruff turns a new release's new rule into a red build
      # on a pull request that changed nothing.
      - name: Lint
        working-directory: pipeline
        run: uvx ruff@0.16.2 check src/znhstry

      # Covers the parts with a right answer that does not need the network or the
      # 290 MB raw layer: the ring arithmetic, and the dtype contract the two write
      # paths share. Both have been wrong before in ways nothing else would catch.
      - name: Unit tests
        working-directory: pipeline
        run: uv run python -m pytest -q

      # The archive is public, so this needs no secret: `restore` reads the key
      # manifest and checks every file's MD5. ~280 MB.
      - name: Restore the raw layer
        working-directory: pipeline
        env:
          NEXT_PUBLIC_DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: uv run python -m znhstry restore

      # The whole warehouse, tests included, the same way the nightly runs it. A
      # `dbt parse` alone let a source binding to a missing glob ship green; only a
      # build against the real raw layer catches that, and the unit tests need a
      # built relation to infer mocked column types from.
      - name: Build warehouse
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build
