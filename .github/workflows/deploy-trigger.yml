name: Deploy the Atlantis trigger

# The Cloudflare Worker whose crons dispatch atlantis.yml every hour and nightly.yml at
# 00:45 UTC, because GitHub's scheduler drops the one and runs the other hours late. Only
# the Worker: the site is deploy.yml and the data is nightly.yml and atlantis.yml.
#
# The Worker needs one secret, a fine-grained GitHub token with Actions: Read and write on
# this repository. It is pushed from the repository secret ATLANTIS_DISPATCH_TOKEN on every
# deploy, so rotating it is: update the repository secret, re-run this workflow.

on:
  push:
    branches: [main]
    paths: ["trigger/**", ".github/workflows/deploy-trigger.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: trigger
          command: deploy
          wranglerVersion: "4"
          # Pushed as Worker secrets after the deploy, from the env below.
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ATLANTIS_DISPATCH_TOKEN }}
