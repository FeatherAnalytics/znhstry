name: Deploy the site

# The site only. It reads its payloads from object storage at runtime, so a data
# refresh does not require a rebuild and this runs on code changes alone.
#
# The static export is built here and pushed with wrangler as Workers static assets,
# under the routes `wrangler.jsonc` names. Building in Actions rather than on
# Cloudflare keeps the build config in the repo and keeps the reachability gate below,
# which a host-side build has no equivalent of.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the data origin is reachable
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          test -n "$DATA_ORIGIN" || { echo "::error::DATA_ORIGIN variable is not set"; exit 1; }
          curl -sfI "$DATA_ORIGIN/global/meta.json" > /dev/null \
            || { echo "::error::$DATA_ORIGIN/global/meta.json is not reachable"; exit 1; }

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web

      - name: Build static export
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}

      # The token needs Workers Scripts:Edit, Workers Routes:Edit and Zone DNS:Edit on
      # znhstry.com - the last two so the custom-domain route in wrangler.jsonc can
      # create its own record. The major is pinned so a new wrangler release cannot
      # change how the assets are served on a push that touched nothing.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4"
