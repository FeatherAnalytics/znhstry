name: Nightly data update

# Data only. The site is static and fetches its payloads from object storage at
# runtime, so refreshing the data needs no rebuild and no deploy - see
# deploy.yml, which runs on code changes instead.

on:
  schedule:
    # 02:15 UTC, which is as early as this can usefully run.
    #
    # QONQR publishes a day's batch just after midnight on the *following* day,
    # not during the day itself. Upstream runs three times daily and only one of
    # them carries data - by commit size on neon-ninja/QONQR_zonedata, the same
    # shape every day:
    #
    #   00:02   +1 -0, 1 file             a no-op
    #   01:03   +15,143 -12,196, 4 files  the day's changelog import
    #   12:02   +8,724 -9,517, 1 file     battlestats only
    #
    # So the first run after midnight is not the one to wait for. `update.sh`
    # commits after `import_mysql_changelog.py`, so the database is current
    # slightly before that 01:03 timestamp; day D is complete by 01:03 on D+1
    # and nothing more arrives until the next midnight. 02:15 leaves 72 minutes
    # of margin, which GitHub's cron drift can eat into without hurting.
    #
    # Off the hour because everything on GitHub's cron queues up there, and a
    # late start only helps. Any row that does arrive late is picked up anyway:
    # `extract_update` refetches the whole current month every run.
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs extract at once: the upstream endpoint is a shared research
# box and concurrent runs would double our request rate against it.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Carries data/raw between runs so the nightly fetch is ~17 requests
      # instead of 88. A miss just means a full extraction, which is correct but
      # slower and heavier on upstream, so the key rolls every run and
      # restore-keys picks up the most recent.
      - name: Restore extracted data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Fetch what changed
        working-directory: pipeline
        run: uv run python -m znhstry update

      - name: Build warehouse
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Export payloads
        working-directory: pipeline
        run: uv run python -m znhstry export

      # The data goes to object storage rather than into the site because it
      # needs response headers a static host cannot set: Content-Encoding: br,
      # and a year-long immutable Cache-Control on shards that never change.
      #
      # Only objects whose ETag differs are sent, so a nightly run pushes a few
      # megabytes rather than the whole 96.
      # R2_ACCOUNT_ID is a secret rather than a variable, and the endpoint is
      # derived from it. Variable values are printed verbatim into run logs, and
      # this repo is public, so anything passed as `vars.` is effectively
      # published. The account id is an identifier rather than a credential and
      # Cloudflare treats it as non-secret, but keeping it out of the logs costs
      # nothing - secrets are masked as ***.
      - name: Upload data
        working-directory: pipeline
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m znhstry upload

      - name: Check the manifest is reachable
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          curl -sfI "$DATA_ORIGIN/global/meta.json" > /dev/null \
            || { echo "::error::$DATA_ORIGIN/global/meta.json is not reachable"; exit 1; }

      - name: Report sizes
        run: du -sh dist/data/global/* | sort -h
