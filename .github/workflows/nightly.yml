name: Nightly data update

# Data only. The site is static and fetches its payloads from object storage at
# runtime, so refreshing the data needs no rebuild and no deploy - see
# deploy.yml, which runs on code changes instead.
#
# This polls rather than guessing. Upstream imports the day's changelog at about
# 01:03 UTC, but GitHub's scheduled runs drift by ten or twenty minutes under
# load, so any fixed time has to carry a margin it usually does not need. A
# cheap freshness check every ten minutes gets within one poll of the real
# import instead, and costs two HTTP requests when there is nothing to do.

on:
  schedule:
    # Every ten minutes across the window the import lands in. Nearly all of
    # these do nothing but the freshness check.
    - cron: "*/10 0-3 * * *"
    # Backstop. If every run in the window above is dropped - GitHub skips
    # scheduled runs under load - this catches the day. It no-ops if the window
    # already did the work.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs extract at once: the upstream endpoint is a shared research
# box and concurrent runs would double our request rate against it. A poll that
# queues behind a real run will find the data already published and stop at the
# check.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Two requests, about a second. Everything expensive is gated on its answer.
  check:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.probe.outputs.fresh }}
    steps:
      - id: probe
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
          API: https://api-proxy.auckland-cer.cloud.edu.au/QONQR
        run: |
          set -uo pipefail

          # What we last published. Unreachable means something is wrong with
          # the bucket, and running is the more useful failure.
          ours=$(curl -sf --max-time 20 "$DATA_ORIGIN/global/meta.json" | jq -r '.date_range[1]' || echo "")
          if [ -z "$ours" ] || [ "$ours" = "null" ]; then
            echo "::warning::could not read the published manifest; running anyway"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What upstream has. One row, one column.
          theirs=$(curl -sf --max-time 30 -A "znhstry/0.1 (freshness check; github.com/FeatherAnalytics/znhstry)" \
            "$API/select%20max(LastUpdateDateUtc)%20as%20m%20from%20changelog" \
            | jq -r '.results[0].m // empty' | cut -d' ' -f1)
          if [ -z "$theirs" ]; then
            # The endpoint is a shared research box. If it is having a moment,
            # stop rather than press on into a full extraction.
            echo "::warning::upstream did not answer; skipping this poll"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "published through $ours, upstream has $theirs"
          if [[ "$theirs" > "$ours" ]]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "nothing new" >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    needs: check
    if: needs.check.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Carries data/raw between runs so the nightly fetch is ~17 requests
      # instead of 88. A miss just means a full extraction, which is correct but
      # slower and heavier on upstream, so the key rolls every run and
      # restore-keys picks up the most recent.
      - name: Restore extracted data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Fetch what changed
        working-directory: pipeline
        run: uv run python -m znhstry update

      - name: Build warehouse
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Export payloads
        working-directory: pipeline
        run: uv run python -m znhstry export

      # The data goes to object storage rather than into the site because it
      # needs response headers a static host cannot set: Content-Encoding: br,
      # and a long immutable Cache-Control on the shards that never change.
      #
      # Only objects whose ETag differs are sent, so a nightly run pushes a few
      # megabytes rather than the whole 96.
      - name: Upload data
        working-directory: pipeline
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: uv run python -m znhstry upload

      - name: Check the manifest is reachable
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          curl -sfI "$DATA_ORIGIN/global/meta.json" > /dev/null \
            || { echo "::error::$DATA_ORIGIN/global/meta.json is not reachable"; exit 1; }

      - name: Report
        run: |
          echo "published through $(curl -s "${{ vars.DATA_ORIGIN }}/global/meta.json" | jq -r '.date_range[1]')" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/data/global/* | sort -h
