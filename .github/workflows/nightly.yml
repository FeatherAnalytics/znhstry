name: Nightly data update

# Data only. The site is static and fetches its payloads from object storage at
# runtime, so refreshing the data needs no rebuild and no deploy - see deploy.yml,
# which runs on code changes instead.
#
# Reads QONQR's published Dropbox drop. Nothing here touches the SQL mirror, and
# nothing here reads another repository.
#
# ## Why a fixed time and no freshness poll
#
# The old workflow polled `select max(LastUpdateDateUtc)` every ten minutes across a
# three-hour window, because asking the mirror was cheap and the import time drifted.
# Dropbox cannot answer that question: a download carries no Last-Modified, and the
# filename carries no year, so "is today's file there yet" costs a full fetch and a
# parse. Polling would mean fetching the same 400 KB twenty times a night.
#
# So this runs once, late enough that the day's file is certainly written, and relies
# on the ingest being self-correcting instead. `plan_slots` reads how far the history
# actually goes and asks for exactly the days that are missing - so a run that fires
# before the file lands does nothing, and the next night picks up both days. Nobody has
# to re-run anything for an ordinary miss.
#
# ## What tells anyone the data has stopped
#
# A quiet upstream is indistinguishable from a healthy no-op: `plan_slots` asks for
# nothing, every step is skipped, and the run is green. The freshness check is the alarm
# - it errors at 7 days, comfortably inside the 31-slot ring, so there is still time to
# fetch the missing days before the slots holding them are overwritten for good.
#
# The one thing it cannot catch is GitHub disabling the schedule, which happens after 60
# days without a commit to the repository: nothing runs, so nothing can fail. GitHub
# emails before it does that, and any push resets the clock - but a repo left alone for
# two months needs the workflow re-enabled by hand, and the ring will have closed over
# most of the gap by then.

on:
  schedule:
    # 02:30 UTC. QONQR writes the slot just after 00:00 and GitHub drifts scheduled runs
    # by ten or twenty minutes under load, so this clears it comfortably.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      slots:
        description: "Ring slots to read, e.g. 7 or 5,6,7. Blank = whatever the history is missing."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Straight from R2, every run, and deliberately not through actions/cache. R2 is
      # the source of truth and the restore costs seconds; a cache is a second copy of
      # the raw layer whose prefix fallback can resurrect an entry from before a layout
      # migration - and a restore that "hits" on one of those skips R2, leaves both
      # layouts side by side, and kills the build on a hive partition mismatch.
      - name: Restore extracted data
        working-directory: pipeline
        run: uv run python -m znhstry restore

      # The dispatch input reaches the shell through the environment, never through
      # `${{ }}`: an expression is pasted into the script before bash sees it, so
      # anything typed in that box would run here, with the R2 credentials in scope.
      - name: Ingest the day's slot
        id: ingest
        working-directory: pipeline
        env:
          SLOTS: ${{ inputs.slots }}
        run: |
          if [ -n "$SLOTS" ]; then
            set -- --slots "$SLOTS"
          fi
          uv run python -m znhstry ingest "$@"

      # The alarm for a source that has gone quiet. Errors at 7 days stale, which is
      # inside the ring, so a failure here still leaves time to recover the missing
      # days; without it a stalled upstream is a green run every night until the slots
      # holding the gap have been overwritten.
      - name: Check the source is fresh
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt source freshness

      # A separate source: the game's live portal, not the Dropbox drop. Allowed to fail
      # without taking the map down with it -- battle reports are an overlay, and a slow
      # web page is not a reason to stop publishing zone control. A run where nothing is
      # missing costs one request.
      - name: Collect battle reports
        id: battlestats
        continue-on-error: true
        working-directory: pipeline
        run: uv run python -m znhstry battlestats

      # One place to decide, because six copies of the same expression is six chances
      # to get it wrong. A failed battlestats step leaves its output empty, and empty
      # must not read as "new data".
      - name: Anything to publish?
        id: changed
        run: |
          events="${{ steps.ingest.outputs.events }}"
          reports="${{ steps.battlestats.outputs.reports }}"
          if [ "$events" != "0" ] || { [ -n "$reports" ] && [ "$reports" != "0" ]; }; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no new events or battle reports since the last run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build warehouse
        if: steps.changed.outputs.any == 'true'
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Export payloads
        if: steps.changed.outputs.any == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry export

      - name: Upload data
        if: steps.changed.outputs.any == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry upload

      # After the export, not before: if a run gets this far the raw layer produced a
      # site, which is the only evidence that what we are about to archive is good.
      - name: Archive raw layer
        if: steps.changed.outputs.any == 'true'
        working-directory: pipeline
        run: uv run python -m znhstry archive

      - name: Check the manifest is reachable
        if: steps.changed.outputs.any == 'true'
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          curl -sfI "$DATA_ORIGIN/global/meta.json" > /dev/null \
            || { echo "::error::$DATA_ORIGIN/global/meta.json is not reachable"; exit 1; }

      - name: Report
        if: steps.changed.outputs.any == 'true'
        env:
          DATA_ORIGIN: ${{ vars.DATA_ORIGIN }}
        run: |
          echo "published through $(curl -s "$DATA_ORIGIN/global/meta.json" | jq -r '.date_range[1]')" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/data/global/* | sort -h
