name: Fetch player profiles by name

# By hand, for one player or a few: fetch their portal profiles now instead of waiting for the nightly queue, then republish the player marts and archive the raw file. Names are validated in Python before any request (letters, digits, _ . - only; at most 50).

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Player names, separated by commas (e.g. poopascoopa, BScared)"
        required: true
        type: string

permissions:
  contents: read

# The nightly writes raw/players/ too; sharing its group means the two never write the profiles file at once. A run started during the nightly waits for it.
concurrency:
  group: battlestats-players
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      QONQR_USERNAME: ${{ secrets.QONQR_USERNAME }}
      QONQR_PASSWORD: ${{ secrets.QONQR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore extracted data
        working-directory: pipeline
        run: uv run python -m znhstry restore

      # The input reaches the shell through the environment, never through `${{ }}`, so whatever is typed in the box cannot run as a command here.
      - name: Fetch the named profiles
        working-directory: pipeline
        env:
          NAMES: ${{ inputs.names }}
        run: |
          test -n "$QONQR_USERNAME" || { echo "::error::QONQR_USERNAME secret is not set"; exit 1; }
          uv run python -m znhstry profiles --names "$NAMES"

      # Marts are published as one complete set, so the whole warehouse is rebuilt, not just the player models.
      - name: Build warehouse
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build

      - name: Publish marts as Parquet
        working-directory: pipeline
        run: |
          uv run python -m znhstry marts
          uv run python -m znhstry upload --marts

      - name: Archive the profiles
        working-directory: pipeline
        run: uv run python -m znhstry archive --prefix players/
