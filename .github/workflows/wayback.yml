name: Ingest Wayback Atlantis snapshots

# One-off, rerunnable. Fetches Internet Archive snapshots of QONQR's Atlantis
# page and stores them as historical observations. Shares the atlantis
# concurrency group because both write raw/atlantis/.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlantis
  cancel-in-progress: false

jobs:
  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: pipeline
        run: uv python install

      - name: Restore Atlantis raw
        working-directory: pipeline
        run: uv run python -m znhstry restore --prefix atlantis/

      - name: Ingest Wayback snapshots
        working-directory: pipeline
        run: uv run python -m znhstry wayback

      - name: Archive Atlantis
        if: ${{ !cancelled() }}
        working-directory: pipeline
        run: uv run python -m znhstry archive --prefix atlantis/
