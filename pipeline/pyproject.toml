[project]
name = "znhstry"
version = "0.1.0"
description = "Zone History — extraction and modelling pipeline"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "polars>=1.20",
    "duckdb>=1.1",
    "numpy>=2.1",
    "brotli>=1.2.0",
    # R2 is S3-compatible; `znhstry upload` talks to it through boto3.
    "boto3>=1.35",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/znhstry"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
