decisions:
  - clusters_computed_in_browser: "CLAUDE.md keeps coordinates out of the MAZ payload because a second copy is a second chance to disagree; that applies to a derived cluster too. Reading the map's own tiles means bench and map cannot disagree about where a zone is. Cost is 9.27 MB, so it sits behind a button."
  - faction_colors_on_one_chart: "Faction share is the one subject where the reserved faction colors are correct. Recoloring would make it disagree with the map. Validator FAILs the dark lightness band (0.673/0.757 vs 0.48-0.67) and passes CVD 8.1, normal-vision 36.6, chroma, contrast. 8.1 is on the floor, so direct labels carry identity."
  - neighborhood_km_one_constant: "48.28032 (30 miles) is both the cluster link cutoff and the map framing margin, so the circle the statistic describes and the circle the reader sees are one circle. Duplicated in config.py and mazClusters.ts by value, like EARTH_RADIUS_KM."
  - days_get_no_portal_link: "The Most Active Zones index names only today's ten, so no URL means 'the whole of 2017-05-22'. Linking a day to its biggest report would put one zone behind a link claiming to be all ten."
  - faction_2019_window_documented_not_repaired: "Test asserts containment outside 2019-07-01..09-11, not the count. A count test goes stale; a containment test catches a share chart elsewhere starting to divide by an incomplete denominator."
  - streaks_log_binned: "Runs go 1 to 152 with almost every zone at 1. Linear bins put ~95% in the first bar."

findings:
  - faction_split_is_broken_only_in_2019: "861 reports fall short of their own total, ALL between 2019-07-01 and 2019-09-11, report numbers 55800-57858. The faction PLAYER columns fail on the same rows, which identifies it as the whole per-faction block arriving partial. Outside the window both splits are exact on all 60,496 reports."
  - not_a_top_50_player_cap: "User's hypothesis, tested and disconfirmed. Largest faction-player sum is 939; 5,537 reports with >50 players outside the window reconcile perfectly; the 861 short reports have a MEDIAN of 7 players."
  - not_geography: "Every country with 10+ reports in the window is 72-97% short, and Atlantis — which has no coordinates at all — sits at 83.1%, on the average. 40 of the 72 days are 100% short."
  - concentration_is_the_exception: "57.0% of MAZ days have no two of the world's most active zones within 30 miles of each other; another 38.3% top out at a pair. Only 36 days in the record reach four or more. A MAZ day is normally ten unrelated fights."
  - distance_grouping_is_stricter_than_region: "20 days at n=5 become 8. The difference is California, whose clusters run 160-1,000 km across. Both Kent days survive as the top of the record."
  - cross_border_clusters_are_real: "332 of 2,372 clusters cross a region line, 18 cross a national one. Saint Louis across Illinois-Missouri, Moscow across the city/oblast line, Thailand across Phangnga/Phuket (the one new n=5 day). NOT the predicted DC/MD/VA or Kansas City."
  - clustering_is_immune_to_regionid_corruption: "2023-05-12 clusters three zones within 29.2 km whose labels claim Moscow, Moskovskaya and Tyumenskaya Oblast. Coordinates put them where they actually are."
  - maz_is_mostly_not_a_battle: "22.1% of reports are one-sided (one faction launching everything); only 10.6% have all three factions launching."
  - half_of_maz_zones_appear_once: "5,871 of 11,723. Leader takes 1,286 of 4,599 days. Longest streak 152 consecutive days; 37.2% ever manage two in a row."
  - reexport_moved_exactly_three_files: "maz_stats.bin.br (new columns), series/global_daily.json.br (PR #12's RECORD_START cut reaching output for the first time), and zone_history/0655.bin.br DELETED (PR #12's integer-division fix removing the spurious block past the end of the index). Other 1,849 shards byte-identical."
  # carried from the 2026-08-10 handoff — still true, still load-bearing
  - maz_stats_is_a_nested_shard_entry: "meta.maz.stats, not a top-level meta.maz_stats. Works with the existing loadShard unchanged."
  - maz_stats_columns_are_misaligned_on_purpose: "players is uint16 then four (now six) int32s, so every int32 column starts on an odd 4-byte boundary and takes decodeColumns' aligned-copy path (web/lib/format.ts:112). Verified against real bytes, not just types."
  - web_has_no_test_runner_by_design: "CLAUDE.md: 'The viewer has none.' Do not add one. Verify client math out-of-band by decoding the real shards in node and comparing against DuckDB — that is the pattern that has worked across both sessions."
  - description_is_not_unique: "2026-06-13 has two different zones both named 'Diamond Springs' in the same cluster. ZoneId is the only key."
  - region_names_do_not_collide_on_a_maz_day: "So Region alone was a safe grouping key for the old analysis despite the zones.RegionId corruption — but distance clustering supersedes it and is immune to that corruption anyway."
  - launches_and_players_tell_different_stories: "Budapest 2024-12-15 is the largest mapped report ever at 20,929 launches from 2 active players; Chermignac 2017-05-22 is 17,885 from 201. Never rank outliers by launches alone."

