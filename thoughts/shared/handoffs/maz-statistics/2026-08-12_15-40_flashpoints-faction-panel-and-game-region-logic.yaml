machine_traps:
  - name: Python HTTPS is dead on this machine
    detail: >
      The corporate bundle at /etc/ssl/afscerts/ca-certificates.crt contains a
      Netskope CA whose basicConstraints are not marked critical, and Python 3.13+
      enables ssl.VERIFY_X509_STRICT by default. Every httpx/urllib call fails with
      "CERTIFICATE_VERIFY_FAILED ... Basic Constraints of CA cert not marked
      critical". curl and uv are unaffected.
    consequence: >
      `znhstry hydrate` and `ingest` cannot fetch here. boto3 to
      r2.cloudflarestorage.com WORKS - that host is not intercepted - so restore,
      upload and archive are all fine.
    workaround: >
      Prime the hydrate cache with `curl --compressed` into data/public/ and run
      `hydrate --offline`. Do NOT disable TLS verification.
  - name: dbt must be run as transform/.venv/bin/dbt
    detail: >
      `uv run dbt` tries to install dbt-core 1.12.0, whose build backend downloads a
      wheel over Python HTTPS and hits the trap above. The venv is Python 3.13 with
      dbt-core 1.11.12 + dbt-duckdb 1.11.0, which needs no such download. dbt-core
      1.11 does NOT work on Python 3.14 (mashumaro raises UnserializableField).
    consequence: The committed uv.lock pins 1.12.0 and is correct for CI. Leave it.
  - name: dbt parse/compile creates an empty data/znhstry.duckdb
    detail: >
      pipeline/tests/test_export_maz.py gates on that file existing, so an empty one
      makes five tests error instead of skip. Delete it after any parse/compile run
      if the warehouse is not built.
  - name: gh auth switch is required for every push
    detail: >
      CLAUDE.local.md's claim that a plain push needs no switch is false and has been
      corrected there. The credential helper is `gh auth git-credential`, which
      serves whichever account gh has active. Batch commits and push once.
  - name: duckdb CLI installed via brew (v1.5.5). NO_COLOR=1 strips ANSI from output.

