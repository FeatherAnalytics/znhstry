findings:
  allgau_2023_05_04: >
    THE BIGGEST FIND OF THE SESSION. Cell 47N 10E, Bavaria into Tyrol: 133,746,135
    bots of churn against a typical day of 11,675, with 594 of 603 zones losing and
    only 5,197 gained. Many fell to zero and reverted to uncaptured. It is 90.6% of
    the entire world's largest single-day decrease (-147,632,940). NOT a battle - in
    a fight the bots move somewhere - this is a garrison network leaving the map.
    MAZ logged ONE report, because a top-ten leaderboard cannot see 594 zones each
    shedding a couple of hundred thousand.
  pre_2019_changelog_is_collection: >
    Clean test: net == churn on a day means NO zone anywhere lost a bot. That held on
    366 of 366 days in 2016, 365 of 365 in 2017, 277 days in 2018, and NEVER from
    2019 on. So every increase record before 2019 is the crawler: the largest single
    day in the table is 2018-10-04 at +2,835,768,704 and the largest week is
    2018-09-24 at +10,030,684,907, both with churn exactly equal to net.
  real_extremes_2019_on: >
    Largest increase 2020-10-25 +553,766,655 over 33,303 zones (that zone count is
    9x a normal day and deserves suspicion). Largest decrease 2023-05-04
    -147,632,940. Largest churn 2020-03-16 at 1,631,989,632 with net only
    +322,652,886 over 4,898 zones - the most violent day in the record, depth rather
    than breadth.
  maz_entry_bar_is_piecewise: >
    The daily floor (tenth-place zone) falls 925 -> 306 launches across 2014-2019 and
    then does not move again: every year since sits between 300 and 366. Median
    active players 19 -> 3, mode 16 -> 2, SD 12.0 -> 2.7. The late game is two
    players almost every time rather than a spread of crowd sizes.
  players_counts_faction_pairs: >
    USER-SUPPLIED, from report 131137: the header says 4 players and the list shows
    3, because one player launched for two factions. So `players` counts
    faction-player pairs, and Chermignac's 201 is an upper bound on humans. This is
    NOT the 2019 faction shortfall, which runs the other way (header higher than the
    faction columns). Unverifiable here - the per-player list is a packed string
    ingest does not unpack. Recorded at CLAUDE.md:611.
  area_outlier_method: >
    Score one-degree cells against their own median and MAD, using churn
    (sum(abs(delta))) not net. Needs two floors or it is noise: >= 200 active days
    and typical churn >= 5,000, otherwise near-dead cells score z = 27,777. Marquette
    2022-03-27 comes back SECOND with no reference to MAZ, which is how we know the
    score finds real events.
  flashpoint_figures: >
    Marquette 2022-03-27: board zones -27,813,744 in a day against a 39k/day
    baseline (712x); 86 neighbours -5,815,281 against 224k/day (26x). Adelaide
    2024-09-12..14: neighbours flip +20k/day to -30k/day. Hebron 2023-12-22:
    neighbours +446k/day before, -3,781,272 on the day. Dallas 2024-03-25: sixth
    largest report ever, 12.5M bots sent, neighbours UP 103,330 - a huge fight with
    no territorial consequence.
  whole_scope_standings: >
    Verified identical from two independent sources (meta.json's `current` block and
    zone_history re-derived): Legion 24,224,517,577 bots / 625,472 zones, Swarm
    26,048,562,013 / 514,265, Faceless 27,578,810,929 / 422,126, 33,861 emptied,
    1,086,718 never played. The five zone figures sum to 2,682,442 and the three
    faction counts sum to meta's own held of 1,561,863. USE THIS TO CHECK THE PANEL.
  korea_pair_undocumented: >
    CLAUDE.md's region list accounts for 446 of 447. The 447th is Hwanghae-namdo
    (North Korea) claimed by 1 zone in South Korea. Not recoverable by name-matching.

