decisions:
  game_region_logic: >
    QONQR's own site counts a country by CountryId and a region by RegionId,
    INDEPENDENTLY. Verified against the live game: Poland 44,080 zones, West
    Pomeranian Voivodeship 1,890, Northwest Territories 198. All three now match
    here exactly.

    So the 447 zones whose region belongs to another country are the game's real
    state, not an import artifact. A region is therefore NOT a subset of its
    country - Poland's regions sum to 44,235 against 44,080, the Solomon Islands'
    to 2,581 against 2,736. Anything presenting regions as a partition must say so.

    Selecting Northwest Territories draws 198 zones across Canada and the Congo with
    the camera framing both. That is correct and looks wrong. Do not "fix" it by
    adding country_id back to the region join: it puts every affected region 155,
    135, 87 or 68 zones below the number a player reads on their own screen.
    assert_region_membership_matches_the_game guards that direction.
  board_vs_run_window: >
    A flashpoint has two windows. board_start/board_end is what on_the_board is
    measured over; run_start/run_end is what playback covers. Collapsing them breaks
    Adelaide: 70 distinct zones reach the leaderboard across its 59 days, so a single
    window turns "the fight vs its surroundings" into "activity vs inactivity". Its
    board is the three tightest days; playback covers the campaign.
  changelog_covered: >
    Six of the ten flashpoints predate usable coverage and show a caveat instead of a
    chart. Absence and zero are different answers - a flat line at zero reads as a
    calm neighborhood. Neighbours moving is not enough to clear the flag: Chermignac's
    circle has 35 neighbour zone-days in 2017 and its anchor has none.
  zone_breakdown_absent_in_change_mode: >
    A per-faction zone count is a level. "Which faction gained most zones" is the
    thing the map refuses to colour by, because it makes one vocabulary mean two.
  held_keeps_its_own_test: >
    In displayWorker, held is NOT zoneCount - byFaction[0]. The two are equal only
    while a zero byte and a zero faction describe the same zones - true today, but an
    invariant of the export's packing two languages away, and depending on it saves
    one decrement per zone.
  one_shard_for_all_flashpoints: >
    Ten objects to carry ten kilobytes is the wrong trade on an r2.dev URL with no
    CDN. Definitions fold into meta.json (3% of a file every cold load already pays
    for) and save a request that would only ever follow it.
  seq_column_in_hydrate: >
    zone_event.seq carries the export's row order. The export is ordered
    (idx, observed_at) but stores only `day`, so 653,123 zone-days arrive tied and a
    zone's standing for a day is the LAST of them. Without it, "state at date D"
    becomes whichever row the planner emitted last.

