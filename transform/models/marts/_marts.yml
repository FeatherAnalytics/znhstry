version: 2

models:
  - name: dim_country
    description: >
      Grain: one row per country. Bounding box, zone count, and the newest day's
      bot counts per faction from fct_country_daily.
    columns:
      - name: country_id
        data_tests: [unique, not_null]
      - name: country_name
        data_tests: [not_null]
      - name: min_longitude
        description: >
          Antimeridian-aware: uses a shifted-by-360 range when that is tighter than
          the raw range. max_longitude can exceed 180 for countries that straddle the
          antimeridian (US, Russia, NZ, Fiji, Kiribati).
      - name: max_longitude
        description: "See min_longitude."
      - name: total_bots
        data_tests: [not_null]
      - name: as_of
        description: The activity_date of the newest row in fct_country_daily.
        data_tests: [not_null]

  - name: dim_zone
    description: "Grain: one row per zone. Geography, current state, current holder."
    columns:
      - name: zone_id
        description: The only unique key. zone_name is deliberately not unique.
        data_tests: [unique, not_null]

  - name: fct_zone_events
    description: >
      Grain: one row per zone per observation. The event spine. Deltas are
      computed against each zone's own previous observation, so they span
      whatever gap that was - never assume a fixed window.

      The grain itself is guarded by
      `assert_zone_events_unique_per_observation`, which is not expressible
      as a generic test here.
    columns:
      - name: zone_id
        description: >
          Comes from the changelog, never from dim_zone, so a null means the
          event stream itself lost a key rather than a join missing.
        data_tests: [not_null]

  - name: fct_zone_battles
    description: >
      Grain: one row per battle report, at a real zone.

      A daily leaderboard, not a log of every fight: QONQR publishes exactly ten
      reports on most covered days and 27-29 on the rest, from its Most Active Zones
      page. A row therefore means "this zone was among the most active in the world
      that day" -- a much stronger claim than an event in fct_zone_events, and one
      that must not be relabeled as "battles that day".

      No zone is reported twice in a day, so battle grain and zone-day grain coincide.
      Coverage starts 2014-01-01, eighteen months after release.

      Mapped battles only. Atlantis tournament reports are excluded because their
      zones have no coordinates, not because they are noise -- they are the heaviest
      fighting in the game. Anything counting all battle reports must read
      stg_battlestats, as must anything counting the few whose zone is absent from
      dim_zone.
    columns:
      # The drift guards live on stg_battlestats, where the rows that could
      # break them still exist. Here the inner join and the where clause have
      # already removed every row a not_null or relationships test could catch,
      # so those pass whatever the source does. This one stays because it is the
      # model's own grain: the join fanning out would break it.
      - name: battle_report_number
        description: QONQR's own identifier for the report. Unique.
        data_tests: [unique, not_null]

  - name: fct_zone_checkpoints
    description: >
      Grain: one row per zone per year boundary. Dense snapshots of every zone's
      state at midnight on 1 January, dormant ones included.

      Built for the viewer's dormancy problem and not used for it: the export
      writes its own `display/anchor_YYYY` from the event stream instead, so
      nothing outside transform/ reads this model. Kept because the question it
      answers -- what did every zone look like on this boundary -- is the one an
      ad-hoc query asks, and because it is the only dense-state model in the
      warehouse.
    columns:
      - name: checkpoint_date
        data_tests: [not_null]

  - name: fct_global_daily
    description: "Grain: one row per calendar day. Dense, cumulative bot counts by faction."
    columns:
      - name: activity_date
        data_tests: [unique, not_null]
      - name: total_bots
        data_tests: [not_null]
      - name: is_latest
        description: True on the newest day in the record, so the current standings need no subquery.

  - name: fct_country_daily
    description: >
      Grain: one row per country per calendar day. Dense over the global span --
      every country gets a row for every day in the record, including days
      before its own first event, where the running totals are zero.
    columns:
      - name: country_id
        data_tests: [not_null]
      - name: is_latest
        description: True on the newest day in the record, one row per country.

  - name: fct_flashpoint_zone
    description: >
      Grain: one row per flashpoint per zone inside its circle. Membership by
      great-circle distance from the anchor, with a bounding box padded 5% in front of
      the haversine -- 111.32 km per degree of latitude is a mid-latitude average, so an
      unpadded box is narrower than the radius it stands for and clips edge zones.

      on_the_board is measured over the board window, never the run window and never all
      time. Widen it and Adelaide's 9 board zones become 70 of its 193, at which point
      the two groups are "active" and "inactive" rather than "the fight" and "its
      surroundings".
    columns:
      - name: flashpoint_id
        data_tests: [not_null]
      - name: zone_id
        data_tests: [not_null]
      - name: on_the_board
        data_tests: [not_null]

  - name: fct_flashpoint_impact
    description: >
      Grain: one row per flashpoint per day per group, sparse over the run window.

      net_delta sums fct_zone_events.total_delta, which is already the step against each
      zone's own previous observation -- so summing it over a window is the net change
      across that window, and dormant zones carry forward for free. The changelog holds
      no row for a day a zone did not move, so anything treating an absent day as a zero
      has discarded the 504,410 zones that last changed in 2019 or earlier.

      zones_moving is how a reader tells a calm neighborhood from missing rows. Six of
      the ten flashpoints produce no on-the-board rows at all, because the record before
      late 2018 is a thin stream of first sightings and 2019 is the collection gap.
    columns:
      - name: net_delta
        data_tests: [not_null]
      - name: zones_moving
        data_tests: [not_null]

  - name: fct_flashpoint
    description: >
      Grain: one row per flashpoint. Dense -- every seeded row appears, including the
      ones the changelog cannot describe. This is the manifest the export packs and the
      viewer's picker reads.

      changelog_covered exists because absence and zero are different answers. It is
      true only when the zones reported fighting have events to show for it; neighbors
      moving is not enough, since Chermignac's circle has neighbor events in 2017 while
      the anchor itself has none. Six of the ten flashpoints are false.
    columns:
      - name: flashpoint_id
        data_tests: [unique, not_null]
      - name: zones_in_circle
        data_tests: [not_null]
      - name: changelog_covered
        data_tests: [not_null]

  - name: fct_atlantis_player_interval
    description: >
      Grain: one row per player, faction, and pair of consecutive observations
      within one tournament month. A player's first observation yields no row.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: faction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless']
      - name: player_name
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]

  - name: fct_atlantis_faction_hourly
    description: >
      Grain: one row per tournament month, faction, and observation the faction
      appears on the board. Interval columns are null at a faction's first
      observation. `minutes` is the gap between the faction's own observations, so a
      player who leaves the board and returns does not split the row.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: faction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless']
      - name: observed_at
        data_tests: [not_null]

  - name: fct_atlantis_zone_interval
    description: >
      Grain: one row per zone and pair of consecutive observations within one
      tournament month.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: zone
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]
      - name: holder
        data_tests:
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless']

  - name: dim_atlantis_tournament
    description: >
      Grain: one row per tournament month. Placements, pools, coverage, and
      per-faction top players at the last observation.
    columns:
      - name: tournament_month
        data_tests: [unique, not_null]

  - name: fct_atlantis_payout
    description: >
      Grain: one row per tournament month, faction, and player on the board at
      the last observation. Each player's share of their placement's pool.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: faction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless']
      - name: player_name
        data_tests: [not_null]

  - name: fct_atlantis_zone_player_daily
    description: >
      Grain: one row per player per battle report for Atlantis tournament zones.
      The stable zone position key is nullable for months before September 2026
      when zone_months has no names.
    columns:
      - name: battle_date
        data_tests: [not_null]
      - name: battle_report_number
        data_tests: [not_null]
      - name: rank
        data_tests: [not_null]
      - name: player_name
        data_tests: [not_null]

  - name: dim_atlantis_tournament_derived
    description: >
      Grain: one row per tournament month, derived from battle reports.
      Schedule, placements by ending bots, and aggregate counts.
    columns:
      - name: tournament_month
        data_tests: [unique, not_null]

  - name: fct_atlantis_player_month_derived
    description: >
      Grain: one row per tournament month, player, and attributed faction.
      Launches, kills, losses, rank within faction, share, and qredits estimate.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: faction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless', 'Unconfirmed']
      - name: player_name
        data_tests: [not_null]
      - name: faction_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['board', 'override', 'report-totals', 'zone-name', 'scraped', 'none']

  - name: fct_atlantis_zone_month_derived
    description: >
      Grain: one row per tournament month, triangle, and zone name.
      Per-zone report counts, launches, ending bots, and holder.
    columns:
      - name: tournament_month
        data_tests: [not_null]
      - name: triangle
        data_tests: [not_null]
      - name: zone_name
        data_tests: [not_null]

  - name: fct_atlantis_placement
    description: >
      Grain: one row per tournament month, faction, and player who finished in
      that faction's top three by launches. Read off the zones named after
      players the following month, which honor the prior month's top three in
      positions 1 to 3. A mercenary can place in two factions in one month.
    columns:
      - name: tournament_month
        description: The month the finish was earned, one before the month the zone carried the name.
        data_tests: [not_null]
      - name: faction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Legion', 'Swarm', 'Faceless']
      - name: player_name
        data_tests: [not_null]
      - name: placement
        description: 1, 2 or 3; null when the finish is certain to be top three but its order is not known.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: placement_source
        description: >
          page when the Atlantis page gives the zone's position; board when read
          from the month's final leaderboard, ties unordered; battle-reports
          when inferred from the prior month's launch rank in battle reports;
          elimination when the other two names were placed; unordered otherwise.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['page', 'board', 'battle-reports', 'elimination', 'unordered']

  - name: dim_atlantis_player
    description: >
      Grain: one row per player with at least one top-three finish, counted
      across every faction they placed in.
    columns:
      - name: player_name
        data_tests: [unique, not_null]
      - name: top_three
        description: Top-three finishes, including those whose order is not known.
      - name: unordered
        description: Top-three finishes with no known first, second or third.
      - name: factions
        description: Every faction the player placed in.

  - name: fct_exchange_rate_daily
    description: "Grain: one row per UTC date: how many Qredits one Cube bought that day. Each date is either our own read of the portal's Exchange page (`source = 'portal'`) or, for dates we did not read, a backfill from `neon-ninja/QONQR_zonedata` (`source = 'neon-ninja'`). Join on the date, e.g. `fct_zone_battles.battle_date = rate_date`."
    columns:
      - name: rate_date
        data_tests: [unique, not_null]
      - name: qredits_per_cube
        data_tests: [not_null]

  - name: fct_player_profile
    description: "Grain: one row per player per fetch of their login-only portal profile. Snapshots, never overwrites: level, faction, status and rank hold only at `scraped_at`, so faction switches and status changes are the difference between rows. `found` false means every retry hit the portal's error page (a renamed or deleted player, or a fault); those rows carry no profile fields. One boolean column per medal, 35 in all. Join to other player tables on `player_key`, the lowercased name, because spelling case varies across the portal's pages."
    data_tests:
      - unique:
          column_name: "player_key || '|' || scraped_at"
    columns:
      - name: player_key
        description: Lowercased player name; the join key to every other player table.
        data_tests: [not_null]
      - name: start_date
        description: When the player reached Private, the first rank every player starts at, so a proxy for when the account started. Null on fetches made before it was collected; each refresh fills it in.

  - name: dim_player
    description: "Grain: one row per player we hold a name for and have fetched, case-insensitive. Profile fields are from the newest fetch that found a profile; null when none ever did. Join on `player_key` = `lower(player_name)` of any other player table."
    columns:
      - name: player_key
        description: Lowercased player name; the join key to every other player table.
        data_tests: [unique, not_null]
      - name: found_on_last_check
        description: False when the newest fetch hit the error page, though an older one found the player — usually a rename.
      - name: start_date
        description: When the player reached Private, a proxy for when the account started. Null until the player's first refresh after it was collected.

  - name: fct_battle_player
    description: "Grain: one row per player per battle report, every Most Active Zones report, tournament ones included (`is_tournament`). Who launched in which zone on which day, with rank, launches, bots killed and bots lost. A battle report is a daily top-ten-zones list, so a player missing from it may still have launched there. `faction` and the two badge columns are known only where the scraper kept per-player rows, mostly tournament reports; elsewhere they are null. Join to `dim_player` on `player_key` and to `fct_zone_battles` on `battle_report_number`."
    data_tests:
      - unique:
          column_name: "battle_report_number || '|' || player_key"
    columns:
      - name: player_key
        description: Lowercased player name; the join key to every other player table.
        data_tests: [not_null]
      - name: battle_report_number
        data_tests: [not_null]
      - name: zone_id
        description: Negative for Atlantis tournament zones, which exist only for their month.
        data_tests: [not_null]
