version: 2

models:
  - name: dim_zone
    description: "Grain: one row per zone. Geography, current state, current holder."
    columns:
      - name: zone_id
        description: The only unique key. zone_name is deliberately not unique.
        data_tests: [unique, not_null]

  - name: fct_zone_events
    description: >
      Grain: one row per zone per observation. The event spine. Deltas are
      computed against each zone's own previous observation, so they span
      whatever gap that was - never assume a fixed window.

      The grain itself is guarded by
      `assert_zone_events_unique_per_observation`, and the three zones with no
      row in `zones` by `assert_orphan_zones_survive_the_dim_zone_join` --
      neither is expressible as a generic test here.
    columns:
      - name: zone_id
        description: >
          Comes from the changelog, never from dim_zone, so a null means the
          event stream itself lost a key rather than a join missing.
        data_tests: [not_null]

  - name: fct_zone_battles
    description: >
      Grain: one row per battle report, at a real zone. 45,675 rows, 11,721 zones.

      A daily leaderboard, not a log of every fight: QONQR publishes exactly 10
      reports on 3,451 of the 4,598 covered days and 27-29 on most of the rest, from
      its Most Active Zones page. A row therefore means "this zone was among the most
      active in the world that day" -- a much stronger claim than an event in
      fct_zone_events, and one that must not be relabeled as "battles that day".

      No zone is reported twice in a day, so battle grain and zone-day grain coincide.
      Coverage starts 2014-01-01, eighteen months after release.

      Mapped battles only. The 15,837 Atlantis tournament reports are excluded because
      their zones have no coordinates, not because they are noise -- they are the
      heaviest fighting in the game. Anything counting all battle reports must read
      stg_battlestats. Five further reports name a zone absent from dim_zone.
    columns:
      # The drift guards live on stg_battlestats, where the rows that could
      # break them still exist. Here the inner join and the where clause have
      # already removed every row a not_null or relationships test could catch,
      # so those pass whatever the source does. This one stays because it is the
      # model's own grain: the join fanning out would break it.
      - name: battle_report_number
        description: QONQR's own identifier for the report. Unique.
        data_tests: [unique, not_null]

  - name: fct_zone_checkpoints
    description: >
      Grain: one row per zone per year boundary. Dense snapshots of every zone's
      state at midnight on 1 January, dormant ones included.

      Built for the viewer's dormancy problem and not used for it: the export
      writes its own `display/anchor_YYYY` from the event stream instead, so
      nothing outside transform/ reads this model. Kept because the question it
      answers -- what did every zone look like on this boundary -- is the one an
      ad-hoc query asks, and because it is the only dense-state model in the
      warehouse.
    columns:
      - name: checkpoint_date
        data_tests: [not_null]

  - name: fct_global_daily
    description: "Grain: one row per calendar day. Dense, cumulative bot counts by faction."
    columns:
      - name: activity_date
        data_tests: [unique, not_null]
      - name: total_bots
        data_tests: [not_null]

  - name: fct_country_daily
    description: >
      Grain: one row per country per calendar day. Dense over the global span --
      every country gets a row for every day in the record, including days
      before its own first event, where the running totals are zero.
    columns:
      - name: country_id
        data_tests: [not_null]

  - name: fct_flashpoint_zone
    description: >
      Grain: one row per flashpoint per zone inside its circle. Membership by
      great-circle distance from the anchor, with a bounding box padded 5% in front of
      the haversine -- 111.32 km per degree of latitude is a mid-latitude average, so an
      unpadded box is narrower than the radius it stands for and clips edge zones.

      on_the_board is measured over the board window, never the run window and never all
      time. Widen it and Adelaide's 9 board zones become 70 of its 193, at which point
      the two groups are "active" and "inactive" rather than "the fight" and "its
      surroundings".
    columns:
      - name: flashpoint_id
        data_tests: [not_null]
      - name: zone_id
        data_tests: [not_null]
      - name: on_the_board
        data_tests: [not_null]

  - name: fct_flashpoint_impact
    description: >
      Grain: one row per flashpoint per day per group, sparse over the run window.

      net_delta sums fct_zone_events.total_delta, which is already the step against each
      zone's own previous observation -- so summing it over a window is the net change
      across that window, and dormant zones carry forward for free. The changelog holds
      no row for a day a zone did not move, so anything treating an absent day as a zero
      has discarded the 504,410 zones that last changed in 2019 or earlier.

      zones_moving is how a reader tells a calm neighborhood from missing rows. Six of
      the ten flashpoints produce no on-the-board rows at all, because the record before
      late 2018 is a thin stream of first sightings and 2019 is the collection gap.
    columns:
      - name: net_delta
        data_tests: [not_null]
      - name: zones_moving
        data_tests: [not_null]

  - name: fct_flashpoint
    description: >
      Grain: one row per flashpoint. Dense -- every seeded row appears, including the
      ones the changelog cannot describe. This is the manifest the export packs and the
      viewer's picker reads.

      changelog_covered exists because absence and zero are different answers. It is
      true only when the zones reported fighting have events to show for it; neighbors
      moving is not enough, since Chermignac's circle has neighbor events in 2017 while
      the anchor itself has none. Six of the ten flashpoints are false.
    columns:
      - name: flashpoint_id
        data_tests: [unique, not_null]
      - name: zones_in_circle
        data_tests: [not_null]
      - name: changelog_covered
        data_tests: [not_null]
