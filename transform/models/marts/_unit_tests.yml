version: 2

unit_tests:
  - name: region_label_follows_region_id_even_across_a_border
    description: >
      The game's own grouping, stated as an example rather than as a join condition.
      Zone 1's region agrees with its country. Zone 2's region belongs to a different
      country -- the real shape of the 447 zones filed under a region on the wrong
      continent -- and keeps that label anyway, because QONQR's site counts a region
      by RegionId and reports 1,890 zones in West Pomeranian Voivodeship including the
      155 sitting in the Solomon Islands.

      A contradictory pair on screen is upstream's, and printing it is the price of a
      total a player can reconcile against their own screen. Dropping the label puts
      every affected region below the game's figure with nothing to explain the gap.
    model: dim_zone
    given:
      - input: ref('stg_zones')
        rows:
          - {zone_id: 1, zone_name: "Agrees",    region_id: 10, country_id: 100, control_state: 1,
             latitude: 0.0, longitude: 0.0, legion_count: 0, swarm_count: 0, faceless_count: 0,
             total_count: 0, observed_at: null, captured_at: null}
          - {zone_id: 2, zone_name: "Disagrees", region_id: 20, country_id: 100, control_state: 1,
             latitude: 0.0, longitude: 0.0, legion_count: 0, swarm_count: 0, faceless_count: 0,
             total_count: 0, observed_at: null, captured_at: null}
      - input: ref('stg_regions')
        rows:
          - {region_id: 10, country_id: 100, region_name: "Right Place"}
          - {region_id: 20, country_id: 999, region_name: "Wrong Continent"}
      - input: ref('stg_countries')
        rows:
          - {country_id: 100, country_name: "Realland", country_code: "RL"}
      - input: ref('stg_factions')
        rows:
          - {faction_id: 1, faction_name: "legion"}
    expect:
      rows:
        - {zone_id: 1, country_name: "Realland", region_name: "Right Place"}
        - {zone_id: 2, country_name: "Realland", region_name: "Wrong Continent"}

  - name: returning_player_does_not_split_the_faction_row
    description: >
      A player can drop off the board and come back, which is ordinary play. Player B's
      interval then spans two observations while player A's spans one. The faction still
      has one row at that observation, its launches summed across both players and its
      rate taken over the gap between the faction's own observations, the same gap the
      Atlantis page divides by.
    model: fct_atlantis_faction_hourly
    given:
      - input: ref('stg_atlantis_leaderboard')
        rows:
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: A, observed_at: "2026-11-05 00:00:00", launches: 100}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: B, observed_at: "2026-11-05 00:00:00", launches: 50}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: A, observed_at: "2026-11-05 00:30:00", launches: 130}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: A, observed_at: "2026-11-05 01:00:00", launches: 140}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: B, observed_at: "2026-11-05 01:00:00", launches: 59}
      - input: ref('fct_atlantis_player_interval')
        rows:
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: A, observed_at: "2026-11-05 00:30:00", minutes: 30.0, launches_gained: 30}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: A, observed_at: "2026-11-05 01:00:00", minutes: 30.0, launches_gained: 10}
          - {tournament_month: 2026-11-01, faction: Swarm, player_name: B, observed_at: "2026-11-05 01:00:00", minutes: 60.0, launches_gained: 9}
    expect:
      rows:
        - {observed_at: "2026-11-05 00:00:00", minutes: null, launches_gained: null, launches_per_hour: null, active_players: null, players_on_board: 2, launches_total: 150}
        - {observed_at: "2026-11-05 00:30:00", minutes: 30.0, launches_gained: 30, launches_per_hour: 60.0, active_players: 1, players_on_board: 1, launches_total: 130}
        - {observed_at: "2026-11-05 01:00:00", minutes: 30.0, launches_gained: 19, launches_per_hour: 38.0, active_players: 2, players_on_board: 2, launches_total: 199}
