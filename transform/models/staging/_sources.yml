version: 2

sources:
  - name: raw
    description: >
      Parquet written by the ingest pipeline (`uv run python -m znhstry ingest`),
      which reads QONQR's published Dropbox drop. Read in place by DuckDB; nothing
      is copied into the warehouse.
    tables:
      - name: changelog
        description: >
          Append-only event stream, one row per zone per observation. A row exists
          only when a zone's counts or control state changed, so spacing is
          irregular. Includes the 29 pre-2012 sentinel rows that carry bots.

          Partitioned by year of `LastUpdateDateUtc`. A nightly append rewrites the
          current year's file and touches nothing else, and DuckDB prunes whole
          partitions from the directory name before reading a byte. The hive column
          `year` is deliberately not selected downstream -- it is a physical
          artifact of the layout, and `observed_at` is the real thing to filter on.
        meta:
          external_location: "read_parquet('../data/raw/changelog/**/*.parquet', hive_partitioning = true)"
        # Freshness is measured against the newest event, which is the only honest
        # clock here -- file mtimes tell you when the ingest ran, not whether it
        # found anything. The ring is the reason error_after is not generous: past
        # 31 days the slots holding the gap have been overwritten and the data is
        # unrecoverable, so a week is the point at which someone must look.
        loaded_at_field: '"LastUpdateDateUtc"'
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
      - name: zones
        description: >
          Current state and geography for every zone. One row per zone, upserted from
          the same daily CSVs the changelog comes from -- a daily file carries a
          complete zones row for every zone it mentions. The newest observation wins,
          decided by `LastUpdateDateUtc`, so re-reading an old slot cannot roll a zone
          backwards.
        meta:
          external_location: "read_parquet('../data/raw/zones/*.parquet')"
      - name: battlestats
        description: >
          One row per battle report: the game's own account of a fight, with starting
          and ending garrisons, player counts and weapon launches. 77 columns, names
          and spaces exactly as scraped.

          Not in the Dropbox drop. QONQR publishes these as HTML at
          `portal.qonqr.com/Home/BattleStatistics/<BRN>`, indexed by the Most Active
          Zones page. History was seeded once from the long-running community scrape
          rather than re-fetched - the BRN range is sparse, so reproducing ~61k rows
          would have meant ~130k requests to the game's own server. `znhstry
          battlestats` collects forward from there, ten pages on a normal day.
        meta:
          external_location: "read_parquet('../data/raw/battlestats/battlestats.parquet')"
      - name: battlestats_players
        description: >
          Per-player rows from battle report pages, with faction from the row's CSS
          class and badge booleans from the span classes. Hive-partitioned by year.
          Populated going forward by scrape_battlestats; null for historical reports
          until the backfill (6b).
        meta:
          external_location: "read_parquet('../data/raw/battlestats/players/**/*.parquet', hive_partitioning=true)"
      - name: battlestats_player_factions
        description: >
          Per-player faction attribution from the solve algorithm. One row per
          tournament month per player with their attributed faction and evidence.
        meta:
          external_location: "read_parquet('../data/raw/battlestats/player_factions/*.parquet')"
      - name: atlantis_leaderboard
        description: >
          The monthly tournament leaderboard at `portal.qonqr.com/Atlantis`, one row per
          player per faction per hourly pull. Launch counts reset to zero on the 1st, and a
          player who launched for two factions in a month appears once under each, which is
          why faction is part of the key. Rank is not stored; the site's tie-sharing rank is
          derived downstream.

          `TournamentMillionKills` is the page's `atlantis-gold` badge, 1,000,000+ kills in
          the current tournament. `WeeklyMillionKills` is the `gold-star` badge, 1,000,000+
          kills this week outside the tournament, with weeks starting 00:00 UTC Sunday.
          Partitioned by year of `ObservedAtUtc`; the hive `year` column is not selected
          downstream.
        meta:
          external_location: "read_parquet('../data/raw/atlantis/leaderboard/**/*.parquet', hive_partitioning = true)"
      - name: atlantis_zones
        description: >
          Bot counts on the nineteen tournament zones, one row per zone per hourly pull.
          `Zone` is a stable position key -- `Prime`, then `Legion 1`..`Legion 6`, `Swarm
          1`..`6`, `Faceless 1`..`6`, numbered from the apex of each faction's triangle,
          left to right, top to bottom -- because the names the site shows change monthly.
          The month's name lives in `atlantis_zone_months`. Partitioned by year of
          `ObservedAtUtc`.
        meta:
          external_location: "read_parquet('../data/raw/atlantis/zones/**/*.parquet', hive_partitioning = true)"
      - name: atlantis_zone_months
        description: >
          What each tournament position was called in a given month, and whether that
          month's rule text for it allowed refresh and recharge cubes. Positions 1-3 are
          named after players and change every month; 4-6 are formation zones like
          `L DEF SHOCK` whose names can also change. Rules are per position, so `Swarm 1`
          and `Legion 1` share one.
        meta:
          external_location: "read_parquet('../data/raw/atlantis/zone_months/*.parquet')"
      - name: atlantis_tournaments
        description: >
          One row per tournament month: the stacking and battle day counts the page states,
          the end they imply, and the winner the banner names after the end. A tournament
          starts 00:00 UTC on the 1st and ends start plus stacking plus battle days, which
          is what the hourly job reads to decide whether to run at all.
        meta:
          external_location: "read_parquet('../data/raw/atlantis/tournaments/*.parquet')"
      - name: countries
        description: Straight from `Countries.csv` in the drop; already the right shape.
        meta:
          external_location: "read_parquet('../data/raw/lookups/countries.parquet')"
      - name: regions
        description: >
          Straight from `Regions.csv`. `regionid` is not authoritative where it
          contradicts a zone's own `CountryId` -- see `dim_zone` for the country-wins
          rule and why it exists.
        meta:
          external_location: "read_parquet('../data/raw/lookups/regions.parquet')"
