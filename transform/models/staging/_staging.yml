version: 2

models:
  - name: stg_battlestats
    description: >
      Grain: one row per battle report, tournament reports included. 61,517 rows.

      The tests live here rather than on fct_zone_battles because this is the last
      model that still holds the rows they are about: the mart inner-joins dim_zone
      and filters `not is_tournament` and `battle_date is not null`, so a null key or
      an unmappable zone is gone before any test downstream could see it.
    columns:
      - name: battle_report_number
        description: QONQR's own identifier, and the key the scraper resumes from.
        data_tests: [unique, not_null]
      - name: zone_id
        description: >
          Negative on a tournament report, where it identifies a player rather than
          a place. Null means the scrape lost the field.
        data_tests:
          - not_null
          # Five mapped reports name a zone that is not in `zones`, so this warns
          # rather than fails: it is watching for that count to move, which would
          # mean the portal and the zone dump have drifted apart. Tournament zones
          # are excluded because they have no row to match by design.
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
              config:
                where: "not is_tournament"
                severity: warn
      - name: battle_date
        description: >
          Parsed from the report page's US month-first date. fct_zone_battles drops
          the rows where this is null, so a scrape that stopped parsing dates would
          shrink the mart silently -- hence the guard at the point the rows still
          exist.
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_flashpoints
    description: >
      Grain: one row per curated flashpoint, as seeded. Ten rows.

      A seed rather than a source: these were found by querying the whole 9.9M-event
      record, which is not something a model can rediscover. Version control is what
      makes the export reproducible and adding one a one-line diff.

      Two windows, and collapsing them breaks the long flashpoints. board_start and
      board_end are the flashpoint's own days, over which on_the_board is measured;
      run_start and run_end are what playback covers. Adelaide's campaign draws 70
      distinct zones onto the leaderboard across its 59 days, so a single window turns
      "the fight against its surroundings" into "activity against inactivity".
    columns:
      - name: flashpoint_id
        description: Stable slug. Names the row in every downstream model and payload.
        data_tests: [unique, not_null]
      - name: anchor_zone_id
        description: >
          ZoneId, never a name and never a coordinate. Description is not unique -- two
          different zones are both called Diamond Springs -- and a coordinate here would
          be a second copy of what dim_zone holds. int_flashpoints resolves it.
        data_tests: [not_null]
      - name: radius_km
        data_tests: [not_null]
